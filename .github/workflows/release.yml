name: Release

on:
  push:
    tags:
      - 'v*'
      
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: mikctl-linux-amd64

          - goos: freebsd
            goarch: amd64
            artifact: mikctl-freebsd-amd64

          - goos: windows
            goarch: amd64
            artifact: mikctl-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: |
          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          go build \
          -ldflags "-X 'mikctl/src/cmd.Version=${GITHUB_REF_NAME}'" \
          -o ${{ matrix.artifact }} \
          ./src

      - name: Upload artifact
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}